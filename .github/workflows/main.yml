name: CI

on:
  push:
    branches:
      - main
    # - gh-actions
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync
      - name: Run lint
        run: uv run pylint src
      # ruff checks ?

  test:
    name: pytest and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync
      - name: Run tests and coverage branch measurements
        run: uv run coverage run --branch -m pytest
      - name: Create coverage report
        run: uv run coverage xml
      - name: Coverage report to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
